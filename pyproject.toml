[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monet"
version = "0.1.0"
description = "File-backed iterative SVG canvas for coding agents"
requires-python = ">=3.14"
dependencies = [
    "click",
    "resvg-py",
]

[project.scripts]
monet = "monet.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 120
