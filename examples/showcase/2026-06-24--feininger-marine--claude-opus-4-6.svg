<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="100%" height="100%" fill="#EDE6D0"/>
  <defs>
    <filter id="layer1-paper" x="0%" y="0%" width="100%" height="100%">
  <!-- High frequency fractal noise for fine paper fiber grain -->
  <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" result="noise" />
  <!-- Force monochromatic warm grey with very low alpha for subtle texture -->
  <feColorMatrix type="matrix" values="0 0 0 0 0.3
                                       0 0 0 0 0.27
                                       0 0 0 0 0.22
                                       0 0 0 0.035 0" result="monoNoise"/>
  <feBlend mode="multiply" in="SourceGraphic" in2="monoNoise" />
</filter>
  </defs>
  <g id="layer-1">
    <!-- Apply paper texture filter to a background overlay -->
    <rect width="800" height="600" filter="url(#layer1-paper)" fill="none" style="mix-blend-mode: multiply; pointer-events: none;"/>

    <!-- Hand-drawn border (Feininger's crossing draftsman lines) -->
    <g stroke="#2C2824" stroke-width="1.2" opacity="0.75" stroke-linecap="round">
      <!-- Left border -->
      <line x1="145" y1="120" x2="145" y2="490" />
      <!-- Right border -->
      <line x1="685" y1="105" x2="685" y2="480" />
      <!-- Top border (slanted slightly) -->
      <line x1="125" y1="135" x2="705" y2="115" />
      <!-- Bottom border (slanted slightly) -->
      <line x1="125" y1="475" x2="705" y2="465" />
    </g>

    <!-- Sea Wash: Crystalline Overlapping Triangles (Translucent Greys) -->
    <g style="mix-blend-mode: multiply;">
      <!-- Wave Base 1 (Dark Grey, Left and Middle) -->
      <polygon points="145,390 400,360 685,385 685,465 145,475" fill="#5A6166" opacity="0.25" />
      <!-- Wave Base 2 (Angled Sharp Intersections) -->
      <polygon points="145,370 320,355 520,380 685,370 685,420 145,430" fill="#4B5154" opacity="0.2" />
      <!-- Wave Base 3 (Lower Dark band) -->
      <polygon points="145,410 450,400 685,415 685,455 145,465" fill="#313638" opacity="0.25" />
    </g>

    <!-- Structural Draft Lines (Subtle geometric guide rays for the horizon/sea) -->
    <g stroke="#3A342E" stroke-width="0.7" opacity="0.4" stroke-dasharray="2,2">
      <line x1="145" y1="365" x2="685" y2="365" />
      <line x1="145" y1="395" x2="685" y2="395" />
      <line x1="145" y1="420" x2="685" y2="420" />
      <!-- Diagonal ray intersecting the water -->
      <line x1="145" y1="350" x2="650" y2="465" />
      <line x1="220" y1="450" x2="550" y2="340" />
    </g>
  </g>
  <g id="layer-2">
    <!-- Group with multiply blending for realistic pigment layering -->
    <g style="mix-blend-mode: multiply;">

      <!-- Left Stern Wedge (dark/sharp element at the back of the ship) -->
      <polygon points="232,354 245,285 262,352" fill="#3D4543" opacity="0.65" />

      <!-- Foremast Sail (Left) - Pale Ochre/Warm Sand -->
      <polygon points="275,318 270,270 315,262 318,310" fill="#E2D49C" opacity="0.75" />

      <!-- Mainmast Lower Sail (Center) - Golden Greenish-Yellow -->
      <polygon points="340,312 345,258 405,248 408,298" fill="#C6C062" opacity="0.8" />

      <!-- Mainmast Upper Sail (Center High) - Soft Sage/Olive Green -->
      <polygon points="345,254 348,220 400,212 405,245" fill="#7D8A64" opacity="0.75" />

      <!-- Mizzenmast Sail (Right) - Deep Forest Green -->
      <polygon points="432,318 440,258 485,248 480,305" fill="#4B5645" opacity="0.8" />

      <!-- Sweeping Jib Sails & Wind Beams (Grey watercolor washes extending forward and up-right) -->
      <polygon points="440,258 640,140 480,305" fill="#6A777F" opacity="0.22" />
      <polygon points="480,285 665,200 520,310" fill="#586770" opacity="0.18" />

      <!-- Sky Wedge Facet (Top-Left Cloud Element) -->
      <polygon points="215,185 365,150 280,180" fill="#605B54" opacity="0.15" />

      <!-- Sky Wedge Facet (Middle-Right Horizon Cloud Element) -->
      <polygon points="560,265 650,230 605,275" fill="#5D635E" opacity="0.15" />

    </g>
  </g>
  <g id="layer-3">
    <!-- Fine Ink Lines (Draftsman Masts, Rigging, Hull, and Spatial Rays) -->
    <g stroke="#221F1C" stroke-width="0.95" stroke-linecap="round" opacity="0.85">

      <!-- ================= SHIP HULL ================= -->
      <!-- Upper Deck Line & Bowsprit -->
      <line x1="215" y1="360" x2="570" y2="340" />
      <line x1="570" y1="340" x2="640" y2="320" />

      <!-- Segmented Hull bottom for hand-drawn geometric aesthetic -->
      <line x1="215" y1="360" x2="240" y2="368" />
      <line x1="240" y1="368" x2="310" y2="365" />
      <line x1="310" y1="365" x2="420" y2="355" />
      <line x1="420" y1="355" x2="510" y2="345" />
      <line x1="510" y1="345" x2="570" y2="340" />

      <!-- Lower hull details and waterlines -->
      <line x1="218" y1="363" x2="565" y2="344" />
      <line x1="225" y1="368" x2="550" y2="351" />
      <line x1="240" y1="375" x2="520" y2="361" />

      <!-- Stern rudder post and aft structure -->
      <line x1="215" y1="360" x2="218" y2="390" />
      <line x1="218" y1="390" x2="240" y2="368" />
      <!-- Small stern mast/flagstaff -->
      <line x1="235" y1="360" x2="230" y2="255" />

      <!-- ================= MASTS & YARDS ================= -->

      <!-- Mizzenmast (Left Mast, x=295) -->
      <line x1="295" y1="363" x2="295" y2="175" />
      <!-- Yards for Mizzenmast -->
      <line x1="265" y1="315" x2="325" y2="315" />
      <line x1="268" y1="265" x2="320" y2="265" />
      <line x1="280" y1="210" x2="310" y2="210" />

      <!-- Mainmast (Center Mast, x=375) -->
      <line x1="375" y1="358" x2="375" y2="125" />
      <!-- Yards for Mainmast -->
      <line x1="330" y1="310" x2="415" y2="310" />
      <line x1="335" y1="250" x2="415" y2="250" />
      <line x1="340" y1="215" x2="405" y2="215" />
      <line x1="355" y1="160" x2="395" y2="160" />

      <!-- Foremast (Right Mast, x=455) -->
      <line x1="455" y1="350" x2="455" y2="165" />
      <!-- Yards for Foremast -->
      <line x1="425" y1="255" x2="495" y2="255" />
      <line x1="440" y1="210" x2="485" y2="210" />
      <line x1="445" y1="175" x2="475" y2="175" />

      <!-- ================= RIGGING AND SPATIAL RAYS ================= -->

      <!-- Main jib stays (long sweeps to bowsprit and right) -->
      <line x1="375" y1="125" x2="640" y2="320" />
      <line x1="455" y1="165" x2="640" y2="320" />
      <line x1="375" y1="215" x2="570" y2="340" />
      <line x1="375" y1="250" x2="510" y2="345" />

      <!-- Sweeping sky rays and stayed rigging linking masts -->
      <line x1="295" y1="175" x2="375" y2="125" />
      <line x1="375" y1="125" x2="455" y2="165" />

      <!-- Feininger's spatial-prism sky lines (extending to borders) -->
      <!-- Top diagonal ray across main mast to bottom-right border -->
      <line x1="250" y1="100" x2="685" y2="280" />
      <!-- Aft stay ray going down-left -->
      <line x1="295" y1="175" x2="145" y2="260" />
      <!-- Rigging stay from foremast to bottom-left border through sea -->
      <line x1="455" y1="165" x2="145" y2="330" />
      <!-- High sky horizontal guide line -->
      <line x1="145" y1="155" x2="420" y2="155" />
      <!-- Right sky ray framing the cloud wedge -->
      <line x1="455" y1="210" x2="685" y2="150" />
      <!-- Lower diagonal dividing ray -->
      <line x1="215" y1="360" x2="685" y2="405" />

      <!-- Cross-mast tiny alignment markings (Feininger's technical cross-ticks) -->
      <line x1="371" y1="120" x2="379" y2="120" />
      <line x1="291" y1="170" x2="299" y2="170" />
      <line x1="451" y1="160" x2="459" y2="160" />
      <line x1="228" y1="250" x2="232" y2="250" />

    </g>
  </g>
  <g id="layer-4">
    <!-- Group of fine etching/hatching lines with slight opacity to resemble aged iron-gall ink -->
    <g stroke="#26231F" stroke-width="0.8" opacity="0.8" stroke-linecap="round">

      <!-- ================= LEFT STERN WEDGE SHADING ================= -->
      <line x1="234" y1="342" x2="234" y2="354" />
      <line x1="238" y1="325" x2="238" y2="354" />
      <line x1="242" y1="305" x2="242" y2="354" />
      <line x1="246" y1="290" x2="246" y2="354" />
      <line x1="250" y1="305" x2="250" y2="353" />
      <line x1="254" y1="322" x2="254" y2="352" />
      <line x1="258" y1="338" x2="258" y2="352" />

      <!-- ================= MIZZENMAST SAIL (YELLOW, LEFT) HATCHING ================= -->
      <line x1="278" y1="273" x2="278" y2="316" />
      <line x1="282" y1="271" x2="282" y2="314" />
      <line x1="286" y1="269" x2="286" y2="313" />
      <line x1="290" y1="267" x2="290" y2="312" />
      <line x1="294" y1="266" x2="294" y2="311" />
      <line x1="298" y1="265" x2="298" y2="311" />
      <line x1="302" y1="264" x2="302" y2="311" />
      <line x1="306" y1="263" x2="306" y2="310" />
      <line x1="310" y1="262" x2="310" y2="310" />
      <line x1="314" y1="262" x2="314" y2="310" />

      <!-- ================= MAINMAST LOWER SAIL (YELLOW-GREEN, CENTER) HATCHING ================= -->
      <line x1="375" y1="252" x2="375" y2="303" />
      <line x1="379" y1="251" x2="379" y2="302" />
      <line x1="383" y1="250" x2="383" y2="301" />
      <line x1="387" y1="249" x2="387" y2="300" />
      <line x1="391" y1="248" x2="391" y2="299" />
      <line x1="395" y1="248" x2="395" y2="299" />
      <line x1="399" y1="248" x2="399" y2="298" />
      <line x1="403" y1="248" x2="403" y2="298" />

      <!-- ================= FOREMAST SAIL (DARK OLIVE, RIGHT) HATCHING ================= -->
      <line x1="436" y1="258" x2="436" y2="316" />
      <line x1="440" y1="257" x2="440" y2="314" />
      <line x1="444" y1="255" x2="444" y2="312" />
      <line x1="448" y1="253" x2="448" y2="310" />
      <line x1="452" y1="251" x2="452" y2="309" />
      <line x1="456" y1="250" x2="456" y2="308" />
      <line x1="460" y1="249" x2="460" y2="307" />
      <line x1="464" y1="249" x2="464" y2="306" />
      <line x1="468" y1="249" x2="468" y2="306" />
      <line x1="472" y1="249" x2="472" y2="305" />
      <line x1="476" y1="249" x2="476" y2="305" />
      <line x1="480" y1="249" x2="480" y2="305" />

      <!-- ================= HULL SHADING (HORIZONTAL & STERN CROSS) ================= -->
      <!-- Horizontal hull contour lines -->
      <line x1="216" y1="361" x2="562" y2="341" />
      <line x1="218" y1="363" x2="558" y2="343" />
      <line x1="222" y1="365" x2="550" y2="345" />
      <line x1="226" y1="367" x2="542" y2="347" />
      <line x1="230" y1="369" x2="532" y2="349" />
      <line x1="234" y1="371" x2="520" y2="351" />
      <line x1="238" y1="373" x2="505" y2="353" />

      <!-- Vertical stern-heavy hatching on hull -->
      <line x1="218" y1="361" x2="218" y2="363" />
      <line x1="222" y1="361" x2="222" y2="365" />
      <line x1="226" y1="361" x2="226" y2="367" />
      <line x1="230" y1="361" x2="230" y2="369" />
      <line x1="234" y1="361" x2="234" y2="371" />
      <line x1="238" y1="361" x2="238" y2="373" />
      <line x1="242" y1="361" x2="242" y2="374" />
      <line x1="246" y1="362" x2="246" y2="374" />
      <line x1="250" y1="362" x2="250" y2="374" />
      <line x1="255" y1="363" x2="255" y2="374" />
      <line x1="260" y1="363" x2="260" y2="373" />
      <line x1="265" y1="363" x2="265" y2="373" />
      <line x1="270" y1="364" x2="270" y2="372" />
      <line x1="275" y1="364" x2="275" y2="372" />
      <line x1="280" y1="364" x2="280" y2="371" />
      <line x1="290" y1="364" x2="290" y2="371" />
      <line x1="300" y1="364" x2="300" y2="370" />

      <!-- ================= WATER TEXTURE (SHIMMERING WATERLINES) ================= -->
      <!-- Long, thin horizontal lines in the sea with spacing/dashing -->
      <line x1="150" y1="378" x2="675" y2="378" stroke-dasharray="10,6" />
      <line x1="160" y1="382" x2="670" y2="382" stroke-dasharray="25,8" />
      <line x1="180" y1="386" x2="650" y2="386" />
      <line x1="200" y1="390" x2="630" y2="390" stroke-dasharray="35,12" />
      <line x1="145" y1="396" x2="520" y2="396" />
      <line x1="280" y1="402" x2="685" y2="402" />
      <line x1="210" y1="408" x2="620" y2="408" stroke-dasharray="15,4" />
      <line x1="145" y1="414" x2="480" y2="414" />
      <line x1="310" y1="425" x2="685" y2="425" stroke-dasharray="40,15" />

      <!-- ================= WIND & LIGHT SKY VECTOR HATCHING ================= -->
      <!-- Parallel shading lines in the sweeping grey sky wedge -->
      <line x1="480" y1="230" x2="620" y2="135" opacity="0.4" />
      <line x1="500" y1="245" x2="630" y2="150" opacity="0.4" />
      <line x1="520" y1="260" x2="640" y2="170" opacity="0.4" />
      <line x1="540" y1="275" x2="650" y2="190" opacity="0.4" />

    </g>

    <!-- ================= SIGNATURE: "Feininger 1936" ================= -->
    <!-- Re-creating Feininger's original hand-lettering via precise, boxy paths -->
    <g stroke="#26231F" stroke-width="1.1" fill="none" opacity="0.8" style="mix-blend-mode: multiply;">
      <!-- F -->
      <path d="M165,450 V441 H171 M165,445 H169" />
      <!-- e -->
      <path d="M174,450 H178 V445 H174 V450" />
      <!-- i -->
      <path d="M181,450 V445 M181,442 V443" />
      <!-- n -->
      <path d="M184,450 V445 H188 V450" />
      <!-- i -->
      <path d="M191,450 V445 M191,442 V443" />
      <!-- n -->
      <path d="M194,450 V445 H198 V450" />
      <!-- g -->
      <path d="M201,450 H205 V445 H201 V450 M201,450 V453 H205" />
      <!-- e -->
      <path d="M208,450 H212 V445 H208 V450" />
      <!-- r -->
      <path d="M215,450 V445 H219" />

      <!-- Space followed by Date "1936" -->
      <!-- 1 -->
      <path d="M226,450 V441 M224,443 L226,441" />
      <!-- 9 -->
      <path d="M229,445 H233 V441 H229 V445 H233 V450 H229" />
      <!-- 3 -->
      <path d="M236,441 H240 V450 H236 M236,445 H240" />
      <!-- 6 -->
      <path d="M243,441 H247 V450 H243 V445 H247" />
    </g>
  </g>
</svg>