    <path d="M240,155 C252,145 268,150 270,168 C272,182 262,192 248,188 C237,184 233,168 238,158 Z" fill="#00ACC1"/>

    <!-- Tiny green leaf near red bird's feet -->
    <path d="M620,370 C632,362 648,368 648,385 C648,398 636,405 624,400 C614,394 612,378 620,370 Z" fill="#388E3C"/>

