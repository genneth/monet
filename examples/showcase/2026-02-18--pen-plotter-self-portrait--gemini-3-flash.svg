  <g id="layer-8">
    <!-- Stochastic Clouds near satellites -->
    <g stroke="#000000" fill="none" stroke-width="0.5">
      <path d="M145,145 l2,1 m-3,4 l1,-2 m5,1 l-2,-2 m4,5 l1,1 m-6,2 l2,-3" />
      <path d="M655,455 l-2,1 m3,-4 l-1,2 m-5,-1 l2,2 m-4,-5 l-1,-1 m6,-2 l-2,3" />
      <path d="M605,95 l1,1 m2,-3 l-4,2 m3,5 l-1,-2 m2,4 l-3,-1" />
      <path d="M205,445 l-1,2 m3,1 l-2,-4 m5,2 l-1,1 m-3,-2 l2,3" />
    </g>

    <!-- Code Streams (Visual Data) -->
    <g stroke="#000000" fill="none" stroke-width="0.8">
      <path d="M410,50 h5 M410,55 h3 M410,60 h6 M410,65 h2 M410,70 h5 M410,75 h4" />
      <path d="M385,520 h4 M385,525 h6 M385,530 h2 M385,535 h5 M385,540 h3 M385,545 h5" />
      <path d="M750,280 v5 M755,280 v3 M760,280 v6 M765,280 v2 M770,280 v5" />
    </g>

    <!-- High-density core polygons (simulated as dense circles for plotter feel) -->
    <circle cx="400" cy="300" r="1.5" stroke="#000000" stroke-width="0.5" fill="none" />
    <circle cx="400" cy="300" r="2.5" stroke="#000000" stroke-width="0.5" fill="none" />
    <circle cx="400" cy="300" r="3.5" stroke="#000000" stroke-width="0.5" fill="none" />
    <circle cx="400" cy="300" r="4.5" stroke="#000000" stroke-width="0.5" fill="none" />

    <!-- Recursion Loops -->
    <path d="M400,300 C 600,100 800,400 400,350" stroke="#000000" fill="none" stroke-width="0.2" opacity="0.6" />
    <path d="M400,300 C 200,500 0,200 400,250" stroke="#000000" fill="none" stroke-width="0.2" opacity="0.6" />

    <!-- Data Filaments enhancement -->
    <path d="M0,0 L150,150 M0,5 L145,150 M5,0 L150,145" stroke="#000000" fill="none" stroke-width="0.1" />
    <path d="M800,600 L650,450 M800,595 L655,450 M795,600 L650,455" stroke="#000000" fill="none" stroke-width="0.1" />
  </g>
  <g id="layer-9">
    <!-- Spectral Radii (Fine secondary structure) -->
    <line x1="400" y1="300" x2="800" y2="100" stroke="#000000" stroke-width="0.1" fill="none" />
    <line x1="400" y1="300" x2="0" y2="500" stroke="#000000" stroke-width="0.1" fill="none" />
    <line x1="400" y1="300" x2="200" y2="0" stroke="#000000" stroke-width="0.1" fill="none" />
    <line x1="400" y1="300" x2="600" y2="600" stroke="#000000" stroke-width="0.1" fill="none" />

    <!-- Vibration Hatching (Near core) -->
    <path d="M410,290 L420,280 M412,288 L422,278 M414,286 L424,276 M416,284 L426,274" stroke="#000000" stroke-width="0.4" fill="none" />
    <path d="M390,310 L380,320 M388,312 L378,322 M386,314 L376,324 M384,316 L374,326" stroke="#000000" stroke-width="0.4" fill="none" />

    <!-- Information 'Drip' (Vertical logic settling) -->
    <line x1="100" y1="300" x2="100" y2="350" stroke="#000000" stroke-width="0.2" fill="none" />
    <line x1="105" y1="300" x2="105" y2="320" stroke="#000000" stroke-width="0.2" fill="none" />
    <line x1="700" y1="300" x2="700" y2="380" stroke="#000000" stroke-width="0.2" fill="none" />
    <line x1="705" y1="300" x2="705" y2="340" stroke="#000000" stroke-width="0.2" fill="none" />

    <!-- Final Core Concentration (Tiny high-density polygons) -->
    <polygon points="400,298 402,300 400,302 398,300" stroke="#000000" stroke-width="0.5" fill="none" transform="rotate(15 400 300)" />
    <polygon points="400,298 402,300 400,302 398,300" stroke="#000000" stroke-width="0.5" fill="none" transform="rotate(30 400 300)" />
    <polygon points="400,298 402,300 400,302 398,300" stroke="#000000" stroke-width="0.5" fill="none" transform="rotate(45 400 300)" />
    <polygon points="400,298 402,300 400,302 398,300" stroke="#000000" stroke-width="0.5" fill="none" transform="rotate(60 400 300)" />
    <polygon points="400,298 402,300 400,302 398,300" stroke="#000000" stroke-width="0.5" fill="none" transform="rotate(75 400 300)" />

    <!-- Connection Refinement -->
    <path d="M150,150 Q275,225 400,300" stroke="#000000" stroke-width="0.1" fill="none" />
    <path d="M650,450 Q525,375 400,300" stroke="#000000" stroke-width="0.1" fill="none" />
  </g>
</svg>