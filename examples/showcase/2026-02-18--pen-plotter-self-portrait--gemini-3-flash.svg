<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <g id="layer-1">
    <rect width="800" height="600" fill="#FFFFFF" />

      <!-- The Core: Nested, rotating squares to create a dense geometric center -->
      <g id="iter1-core" stroke="#000000" stroke-width="0.5" fill="none">
        <rect x="300" y="200" width="200" height="200" transform="rotate(0, 400, 300)" />
        <rect x="300" y="200" width="200" height="200" transform="rotate(5, 400, 300)" />
        <rect x="300" y="200" width="200" height="200" transform="rotate(10, 400, 300)" />
        <rect x="300" y="200" width="200" height="200" transform="rotate(15, 400, 300)" />
        <rect x="300" y="200" width="200" height="200" transform="rotate(20, 400, 300)" />
        <rect x="300" y="200" width="200" height="200" transform="rotate(25, 400, 300)" />
        <rect x="300" y="200" width="200" height="200" transform="rotate(30, 400, 300)" />
        <rect x="300" y="200" width="200" height="200" transform="rotate(35, 400, 300)" />
        <rect x="300" y="200" width="200" height="200" transform="rotate(40, 400, 300)" />
        <rect x="300" y="200" width="200" height="200" transform="rotate(45, 400, 300)" />
        <rect x="300" y="200" width="200" height="200" transform="rotate(50, 400, 300)" />
        <rect x="300" y="200" width="200" height="200" transform="rotate(55, 400, 300)" />
        <rect x="300" y="200" width="200" height="200" transform="rotate(60, 400, 300)" />
        <rect x="300" y="200" width="200" height="200" transform="rotate(65, 400, 300)" />
        <rect x="300" y="200" width="200" height="200" transform="rotate(70, 400, 300)" />
        <rect x="300" y="200" width="200" height="200" transform="rotate(75, 400, 300)" />
        <rect x="300" y="200" width="200" height="200" transform="rotate(80, 400, 300)" />
        <rect x="300" y="200" width="200" height="200" transform="rotate(85, 400, 300)" />
      </g>

      <!-- Primary Framework: Radial lines extending to the edges -->
      <g id="iter1-framework" stroke="#000000" stroke-width="0.8">
        <line x1="400" y1="300" x2="800" y2="300" />
        <line x1="400" y1="300" x2="0" y2="300" />
        <line x1="400" y1="300" x2="400" y2="0" />
        <line x1="400" y1="300" x2="400" y2="600" />
        <line x1="400" y1="300" x2="800" y2="600" />
        <line x1="400" y1="300" x2="0" y2="0" />
        <line x1="400" y1="300" x2="800" y2="0" />
        <line x1="400" y1="300" x2="0" y2="600" />
      </g>
  </g>
  <g id="layer-2">
    <!-- Inference Paths: Curved lines representing non-linear thought -->
      <path d="M 400 300 C 500 100, 700 200, 800 150" stroke="black" fill="none" stroke-width="0.5" />
      <path d="M 400 300 C 300 100, 100 200, 0 150" stroke="black" fill="none" stroke-width="0.5" />
      <path d="M 400 300 C 500 500, 700 400, 800 450" stroke="black" fill="none" stroke-width="0.5" />
      <path d="M 400 300 C 300 500, 100 400, 0 450" stroke="black" fill="none" stroke-width="0.5" />
      <path d="M 400 300 C 600 300, 700 0, 400 0" stroke="black" fill="none" stroke-width="0.5" />
      <path d="M 400 300 C 200 300, 100 0, 400 0" stroke="black" fill="none" stroke-width="0.5" />
      <path d="M 400 300 C 600 300, 700 600, 400 600" stroke="black" fill="none" stroke-width="0.5" />
      <path d="M 400 300 C 200 300, 100 600, 400 600" stroke="black" fill="none" stroke-width="0.5" />

      <!-- Increasing Core Density with jittered circles -->
      <circle cx="400.5" cy="300" r="10" stroke="black" fill="none" stroke-width="0.3" />
      <circle cx="399.5" cy="300" r="20" stroke="black" fill="none" stroke-width="0.3" />
      <circle cx="400" cy="300.5" r="30" stroke="black" fill="none" stroke-width="0.3" />
      <circle cx="400" cy="299.5" r="40" stroke="black" fill="none" stroke-width="0.3" />
      <circle cx="400" cy="300" r="50" stroke="black" fill="none" stroke-width="0.3" />
      <circle cx="400" cy="300" r="60" stroke="black" fill="none" stroke-width="0.3" />
      <circle cx="400" cy="300" r="70" stroke="black" fill="none" stroke-width="0.3" />
      <circle cx="400" cy="300" r="80" stroke="black" fill="none" stroke-width="0.3" />
  </g>
  <g id="layer-3">
    <!-- Central Singularity: High density small polygons -->
      <g stroke="black" fill="none" stroke-width="0.5">
        <polygon points="400,295 404,297 404,303 400,305 396,303 396,297" transform="rotate(10 400 300)" />
        <polygon points="400,293 406,296 406,304 400,307 394,304 394,296" transform="rotate(20 400 300)" />
        <polygon points="400,290 408,294 408,306 400,310 392,306 392,294" transform="rotate(30 400 300)" />
        <polygon points="400,288 410,292 410,308 400,312 390,308 390,292" transform="rotate(40 400 300)" />
        <polygon points="400,285 412,290 412,310 400,315 388,310 388,290" transform="rotate(50 400 300)" />
      </g>

      <!-- Interference Arcs in quadrants -->
      <g stroke="black" fill="none" stroke-width="0.3">
        <path d="M 100,100 A 300,300 0 0 1 200,50 M 110,110 A 300,300 0 0 1 210,60 M 120,120 A 300,300 0 0 1 220,70 M 130,130 A 300,300 0 0 1 230,80" />
        <path d="M 700,100 A 300,300 0 0 0 600,50 M 690,110 A 300,300 0 0 0 590,60 M 680,120 A 300,300 0 0 0 580,70 M 670,130 A 300,300 0 0 0 570,80" />
        <path d="M 100,500 A 300,300 0 0 0 200,550 M 110,490 A 300,300 0 0 0 210,540 M 120,480 A 300,300 0 0 0 220,530" />
        <path d="M 700,500 A 300,300 0 0 1 600,550 M 690,490 A 300,300 0 0 1 590,540 M 680,480 A 300,300 0 0 1 580,530" />
      </g>

      <!-- Data Filaments along diagonals -->
      <g stroke="black" fill="none" stroke-width="0.2">
        <line x1="405" y1="305" x2="795" y2="595" />
        <line x2="410" y2="310" x1="800" y1="600" />
        <line x1="395" y1="305" x2="5" y2="595" />
        <line x2="390" y2="310" x1="0" y1="600" />
        <line x1="405" y1="295" x2="795" y2="5" />
        <line x2="410" y2="290" x1="800" y1="0" />
        <line x1="395" y1="295" x2="5" y2="5" />
        <line x2="390" y2="290" x1="0" y1="0" />
      </g>
  </g>
  <g id="layer-4">
    <!-- Data Filaments along diagonals -->
    <g stroke="black" stroke-width="0.5" fill="none">
        <!-- Top Left to Center filaments -->
        <path d="M 50,50 L 350,260 M 60,40 L 360,250 M 40,60 L 340,270" />
        <!-- Top Right to Center filaments -->
        <path d="M 750,50 L 450,260 M 740,40 L 440,250 M 760,60 L 460,270" />
        <!-- Bottom Left to Center filaments -->
        <path d="M 50,550 L 350,340 M 60,560 L 360,350 M 40,540 L 340,330" />
        <!-- Bottom Right to Center filaments -->
        <path d="M 750,550 L 450,340 M 740,560 L 440,350 M 760,540 L 460,330" />
    </g>

    <!-- Offset Concentric Circles for Moiré Interferences -->
    <g stroke="black" stroke-width="0.3" fill="none">
        <circle cx="405" cy="305" r="120" />
        <circle cx="405" cy="305" r="140" />
        <circle cx="405" cy="305" r="160" />
        <circle cx="395" cy="295" r="130" />
        <circle cx="395" cy="295" r="150" />
        <circle cx="395" cy="295" r="170" />
    </g>

    <!-- Shattered geometry in the periphery -->
    <g stroke="black" stroke-width="0.8" fill="none">
        <polyline points="50,100 70,80 90,110 60,120 50,100" />
        <polyline points="750,100 730,80 710,110 740,120 750,100" />
        <polyline points="50,500 70,520 90,490 60,480 50,500" />
        <polyline points="750,500 730,520 710,490 740,480 750,500" />
    </g>

    <!-- High-density core singularity (tiny polygons) -->
    <g stroke="black" stroke-width="0.2" fill="none">
        <polygon points="400,298 402,300 400,302 398,300" transform="rotate(15 400 300)" />
        <polygon points="400,296 404,300 400,304 396,300" transform="rotate(30 400 300)" />
        <polygon points="400,294 406,300 400,306 394,300" transform="rotate(45 400 300)" />
        <polygon points="400,292 408,300 400,308 392,300" transform="rotate(60 400 300)" />
    </g>
  </g>
  <g id="layer-5">
    <!-- Satellite Clusters (Sub-networks) -->
      <g stroke="#000000" fill="none" stroke-width="0.5">
        <circle cx="150" cy="150" r="15" />
        <path d="M135,150 L165,150 M150,135 L150,165 M140,140 L160,160 M140,160 L160,140" />
        <circle cx="650" cy="450" r="20" />
        <path d="M630,450 L670,450 M650,430 L650,470 M635,435 L665,465 M635,465 L665,435" />
        <circle cx="600" cy="100" r="10" />
        <path d="M590,100 L610,100 M600,90 L600,110" />
      </g>

      <!-- Jitter Lines (Processing Noise) -->
      <g stroke="#000000" stroke-width="0.3">
        <line x1="50" y1="500" x2="70" y2="500" />
        <line x1="50" y1="505" x2="65" y2="505" />
        <line x1="50" y1="510" x2="75" y2="510" />
        <line x1="750" y1="100" x2="750" y2="120" />
        <line x1="755" y1="100" x2="755" y2="115" />
        <line x1="200" y1="50" x2="220" y2="50" />
        <line x1="400" y1="580" x2="420" y2="580" />
      </g>

      <!-- Large-scale Moiré Gradients -->
      <g stroke="#000000" fill="none" stroke-width="0.2">
        <circle cx="-200" cy="-200" r="800" />
        <circle cx="-200" cy="-200" r="810" />
        <circle cx="-200" cy="-200" r="820" />
        <circle cx="-200" cy="-200" r="830" />
        <circle cx="-200" cy="-200" r="840" />
        <circle cx="-200" cy="-200" r="850" />
      </g>
  </g>
  <g id="layer-6">
    <!-- Connective Tissue: Fine lines between satellites and core -->
      <line x1="150" y1="150" x2="400" y2="300" stroke="black" stroke-width="0.3" />
      <line x1="650" y1="450" x2="400" y2="300" stroke="black" stroke-width="0.3" />
      <line x1="600" y1="100" x2="400" y2="300" stroke="black" stroke-width="0.3" />
      <line x1="750" y1="150" x2="400" y2="300" stroke="black" stroke-width="0.2" />
      <line x1="50" y1="450" x2="400" y2="300" stroke="black" stroke-width="0.2" />

      <!-- Hatching Density in bottom left -->
      <g id="iter7-hatching">
        <line x1="50" y1="580" x2="150" y2="480" stroke="black" stroke-width="0.5" />
        <line x1="60" y1="580" x2="160" y2="480" stroke="black" stroke-width="0.5" />
        <line x1="70" y1="580" x2="170" y2="480" stroke="black" stroke-width="0.5" />
        <line x1="80" y1="580" x2="180" y2="480" stroke="black" stroke-width="0.5" />
        <line x1="90" y1="580" x2="190" y2="480" stroke="black" stroke-width="0.5" />
        <line x1="100" y1="580" x2="200" y2="480" stroke="black" stroke-width="0.5" />
        <line x1="110" y1="580" x2="210" y2="480" stroke="black" stroke-width="0.5" />
      </g>

      <!-- Logical Fragments: Small, sharp geometric shapes -->
      <polygon points="120,400 125,390 135,405" fill="none" stroke="black" stroke-width="1" />
      <polygon points="700,200 710,215 690,210" fill="none" stroke="black" stroke-width="1" />
      <polyline points="50,100 60,110 55,120 45,115 50,100" fill="none" stroke="black" stroke-width="0.8" />
      <polyline points="720,520 735,530 725,545 710,535 720,520" fill="none" stroke="black" stroke-width="0.8" />

      <!-- Heart of Singularity: Ultra-dense core refinement -->
      <circle cx="400" cy="300" r="1" fill="black" />
      <circle cx="400" cy="300" r="3" fill="none" stroke="black" stroke-width="0.5" />
      <circle cx="400" cy="300" r="5" fill="none" stroke="black" stroke-width="0.5" />
      <circle cx="400" cy="300" r="7" fill="none" stroke="black" stroke-width="0.5" />
      <circle cx="400" cy="300" r="9" fill="none" stroke="black" stroke-width="0.5" />
  </g>
  <g id="layer-7">
    <!-- Background Coordinate System (Grid) -->
      <g id="iter8-grid" stroke="#000000" stroke-width="0.1" fill="none">
        <line x1="0" y1="60" x2="800" y2="60" />
        <line x1="0" y1="120" x2="800" y2="120" />
        <line x1="0" y1="180" x2="800" y2="180" />
        <line x1="0" y1="240" x2="800" y2="240" />
        <line x1="0" y1="360" x2="800" y2="360" />
        <line x1="0" y1="420" x2="800" y2="420" />
        <line x1="0" y1="480" x2="800" y2="480" />
        <line x1="0" y1="540" x2="800" y2="540" />
        <line x1="80" y1="0" x2="80" y2="600" />
        <line x1="160" y1="0" x2="160" y2="600" />
        <line x1="240" y1="0" x2="240" y2="600" />
        <line x1="320" y1="0" x2="320" y2="600" />
        <line x1="480" y1="0" x2="480" y2="600" />
        <line x1="560" y1="0" x2="560" y2="600" />
        <line x1="640" y1="0" x2="640" y2="600" />
        <line x1="720" y1="0" x2="720" y2="600" />
      </g>

      <!-- Data Buses (Parallel Conduits) -->
      <g id="iter8-buses" stroke="#000000" stroke-width="0.2" fill="none">
        <path d="M400,300 L150,150 M402,302 L152,152 M398,298 L148,148" />
        <path d="M400,300 L650,450 M402,302 L652,452 M398,298 L648,448" />
        <path d="M400,300 L600,100 M402,298 L602,098 M398,302 L598,102" />
      </g>

      <!-- Bit Noise (Small Squares) -->
      <g id="iter8-bits" stroke="#000000" stroke-width="0.5" fill="none">
        <rect x="390" y="290" width="2" height="2" />
        <rect x="410" y="310" width="2" height="2" />
        <rect x="385" y="315" width="2" height="2" />
        <rect x="415" y="285" width="2" height="2" />
        <rect x="400" y="270" width="2" height="2" />
        <rect x="400" y="330" width="2" height="2" />
        <rect x="370" y="300" width="2" height="2" />
        <rect x="430" y="300" width="2" height="2" />
      </g>

      <!-- New Thought Cluster (Bottom Leftish) -->
      <g id="iter8-cluster" stroke="#000000" stroke-width="0.3" fill="none">
        <path d="M200,450 L220,470 L180,470 Z" />
        <path d="M210,460 L230,440 L210,420 Z" />
        <line x1="190" y1="440" x2="240" y2="440" />
        <line x1="190" y1="445" x2="240" y2="445" />
        <line x1="190" y1="450" x2="240" y2="450" />
