<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <rect width="100%" height="100%" fill="#F6F3EB"/>
  <defs>
    <pattern id="iter1-grid" width="12" height="12" patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="12" y2="0" stroke="#161513" stroke-width="1" />
  <line x1="0" y1="0" x2="0" y2="12" stroke="#161513" stroke-width="1" />
</pattern>
<pattern id="iter1-vlines" width="5" height="10" patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="10" stroke="#161513" stroke-width="1.2" />
</pattern>
<pattern id="iter1-hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="8" stroke="#161513" stroke-width="1.5" />
</pattern>
<pattern id="iter1-dense-grid" width="6" height="6" patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="6" y2="0" stroke="#161513" stroke-width="0.8" />
  <line x1="0" y1="0" x2="0" y2="6" stroke="#161513" stroke-width="0.8" />
</pattern>
  </defs>
  <g id="layer-1">
    <!-- Base horizontal scaffold lines -->
    <line x1="160" y1="410" x2="640" y2="410" stroke="#161513" stroke-width="3" stroke-linecap="round" />
    <line x1="190" y1="404" x2="610" y2="404" stroke="#161513" stroke-width="1" />

    <!-- Large foundational semi-circle bowl -->
    <path d="M 220 410 A 180 180 0 0 0 580 410" fill="none" stroke="#161513" stroke-width="4" stroke-linecap="round" />

    <!-- Central structural triangle, with inner geometric subdivisions -->
    <polygon points="400,240 450,480 350,480" fill="none" stroke="#161513" stroke-width="2.5" />
    <polygon points="400,280 435,450 365,450" fill="none" stroke="#161513" stroke-width="1.5" />
    <!-- Inner solid bar in the triangle -->
    <line x1="400" y1="280" x2="400" y2="450" stroke="#161513" stroke-width="2" />

    <!-- Upper left curved mast/tower structure -->
    <path d="M 285 410 L 250 240 Q 230 200 260 190 Q 295 180 280 240 L 305 410 Z" fill="none" stroke="#161513" stroke-width="2.5" />

    <!-- Vertical rectangular tower overlay -->
    <rect x="330" y="270" width="30" height="135" fill="none" stroke="#161513" stroke-width="2" />

    <!-- Horizontal long beam element in the background -->
    <line x1="160" y1="330" x2="310" y2="330" stroke="#161513" stroke-width="1.5" />
    <line x1="170" y1="350" x2="280" y2="350" stroke="#161513" stroke-width="1" />
  </g>
  <g id="layer-2">
    <!-- Upper center hatched sun (half circle) -->
    <path d="M 330 130 A 35 35 0 0 1 400 130 Z" fill="url(#iter1-hatch)" stroke="#161513" stroke-width="1.5" />

    <!-- Upper right complex geometric box -->
    <rect x="470" y="195" width="95" height="40" fill="none" stroke="#161513" stroke-width="2" />
    <!-- Inner subdivisions of the box -->
    <line x1="495" y1="195" x2="495" y2="235" stroke="#161513" stroke-width="1.2" />
    <line x1="515" y1="195" x2="515" y2="235" stroke="#161513" stroke-width="1.2" />
    <line x1="540" y1="195" x2="540" y2="235" stroke="#161513" stroke-width="2" />
    <!-- Solid block inside the upper right box -->
    <rect x="540" y="195" width="25" height="40" fill="#161513" />
    <!-- Some tiny internal detail lines -->
    <line x1="478" y1="210" x2="490" y2="210" stroke="#161513" stroke-width="1" />
    <line x1="478" y1="220" x2="490" y2="220" stroke="#161513" stroke-width="1" />
    <line x1="502" y1="215" x2="510" y2="215" stroke="#161513" stroke-width="1" />

    <!-- Left mast cap (solid crescent/wing) -->
    <path d="M 230 190 C 220 170, 235 145, 270 140 C 262 165, 252 180, 248 190 Z" fill="#161513" />

    <!-- Right side heavily-textured vertical pillar -->
    <rect x="465" y="255" width="40" height="150" fill="none" stroke="#161513" stroke-width="2" />
    <!-- Upper section with horizontal bars -->
    <line x1="465" y1="265" x2="505" y2="265" stroke="#161513" stroke-width="1.5" />
    <line x1="465" y1="275" x2="505" y2="275" stroke="#161513" stroke-width="1.5" />
    <line x1="465" y1="285" x2="505" y2="285" stroke="#161513" stroke-width="1.5" />
    <line x1="465" y1="295" x2="505" y2="295" stroke="#161513" stroke-width="1.5" />
    <line x1="465" y1="305" x2="505" y2="305" stroke="#161513" stroke-width="1.5" />
    <line x1="465" y1="315" x2="505" y2="315" stroke="#161513" stroke-width="1.5" />
    <line x1="465" y1="325" x2="505" y2="325" stroke="#161513" stroke-width="1.5" />
    <!-- Lower section with dense grid -->
    <rect x="465" y="325" width="40" height="80" fill="url(#iter1-dense-grid)" stroke="#161513" stroke-width="1" />

    <!-- Texturing inside Left vertical tower -->
    <rect x="335" y="285" width="20" height="115" fill="url(#iter1-grid)" stroke="#161513" stroke-width="1" />
  </g>
  <g id="layer-3">
    <!-- Details inside the left mast (vertical organic lines) -->
    <path d="M 264 240 L 293 410" stroke="#161513" stroke-width="1.2" />
    <path d="M 271 240 L 298 410" stroke="#161513" stroke-width="0.8" />
    <path d="M 257 240 L 288 410" stroke="#161513" stroke-width="0.8" stroke-dasharray="2,2" />

    <!-- Little architectural dome structure inside the bowl on the left -->
    <path d="M 290 410 L 335 410" stroke="#161513" stroke-width="2" />
    <path d="M 295 410 A 15 15 0 0 1 325 410 Z" fill="#161513" />
    <!-- Lines and spheres above/on the dome -->
    <line x1="310" y1="395" x2="310" y2="380" stroke="#161513" stroke-width="1.2" />
    <circle cx="310" cy="378" r="3.5" fill="#161513" />
    <circle cx="298" cy="392" r="2.5" fill="#161513" />
    <circle cx="322" cy="392" r="2.5" fill="#161513" />
    <!-- Small horizontal bars beneath the dome -->
    <line x1="295" y1="416" x2="330" y2="416" stroke="#161513" stroke-width="1" />
    <line x1="298" y1="421" x2="327" y2="421" stroke="#161513" stroke-width="1" />
    <line x1="303" y1="426" x2="322" y2="426" stroke="#161513" stroke-width="1" />

    <!-- Details inside the bottom of the central triangle -->
    <!-- Solid trapezoid at the very bottom of the inner triangle -->
    <polygon points="368,443 432,443 435,450 365,450" fill="#161513" />
    <!-- Horizontal teeth/lines in the bottom part of the triangle -->
    <line x1="363" y1="456" x2="437" y2="456" stroke="#161513" stroke-width="1.5" />
    <line x1="360" y1="462" x2="440" y2="462" stroke="#161513" stroke-width="1.5" />
    <line x1="357" y1="468" x2="443" y2="468" stroke="#161513" stroke-width="1.5" />
    <!-- A small solid black triangle nested at the bottom center -->
    <polygon points="400,455 415,480 385,480" fill="#161513" />

    <!-- Floating solid rectangle on the lower left of the bowl -->
    <rect x="290" y="520" width="22" height="7" fill="#161513" />

    <!-- Small decorative circle and horizontal line on the right side of the bowl -->
    <line x1="535" y1="410" x2="615" y2="410" stroke="#161513" stroke-width="1.5" />
    <circle cx="615" cy="410" r="8" fill="none" stroke="#161513" stroke-width="1.5" />
    <!-- A few vertical dashes under this line -->
    <line x1="550" y1="415" x2="550" y2="425" stroke="#161513" stroke-width="1" />
    <line x1="560" y1="415" x2="560" y2="425" stroke="#161513" stroke-width="1" />
    <line x1="570" y1="415" x2="570" y2="425" stroke="#161513" stroke-width="1" />

    <!-- Floating crescent moon on the right, filled with an organic pattern -->
    <path d="M 610 440 C 640 470, 640 515, 610 545 C 622 515, 622 470, 610 440 Z" fill="url(#iter1-hatch)" stroke="#161513" stroke-width="1.5" />
  </g>
  <g id="layer-4">
    <!-- Vertical axis extensions to unify the composition vertically -->
    <line x1="400" y1="240" x2="400" y2="90" stroke="#161513" stroke-width="1.2" stroke-dasharray="4,4" />
    <line x1="400" y1="480" x2="400" y2="587" stroke="#161513" stroke-width="2" />

    <!-- Concentric inner arc inside the big bowl to add geometric depth -->
    <path d="M 238 410 A 162 162 0 0 0 562 410" fill="none" stroke="#161513" stroke-width="1" />
    <path d="M 250 410 A 150 150 0 0 0 550 410" fill="none" stroke="#161513" stroke-width="0.7" stroke-dasharray="5,3" />

    <!-- Ladder structure on the left side horizontal beams -->
    <line x1="185" y1="325" x2="185" y2="355" stroke="#161513" stroke-width="1.2" />
    <line x1="225" y1="325" x2="225" y2="355" stroke="#161513" stroke-width="1.2" />
    <line x1="245" y1="325" x2="245" y2="355" stroke="#161513" stroke-width="1.2" />
    <!-- A solid rectangular block cutting through the ladder -->
    <rect x="201" y="325" width="8" height="30" fill="#161513" />

    <!-- Tiny floating horizontal triangle in the top-left sky -->
    <polygon points="160,120 190,125 160,130" fill="#161513" />

    <!-- Three precise vertical bars near the center-left above the horizon -->
    <rect x="376" y="365" width="4.5" height="24" fill="#161513" />
    <rect x="384" y="365" width="4.5" height="24" fill="#161513" />
    <rect x="392" y="365" width="4.5" height="24" fill="#161513" />

    <!-- Small balancing circles/points near the crescent moon on the right -->
    <circle cx="582" cy="445" r="3" fill="#161513" />
    <circle cx="598" cy="460" r="1.5" fill="#161513" />
  </g>
  <g id="layer-5">
    <!-- Right side flag/vane structure extending from the main pillar -->
    <line x1="505" y1="310" x2="555" y2="310" stroke="#161513" stroke-width="1.5" />
    <line x1="505" y1="322" x2="540" y2="322" stroke="#161513" stroke-width="0.8" />
    <rect x="542" y="295" width="13" height="15" fill="#161513" />

    <!-- Stylized artist monogram in the bottom-left corner -->
    <path d="M 180 565 L 180 580" stroke="#161513" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 180 572 L 187 565" stroke="#161513" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 180 572 C 185 575, 187 577, 188 580" fill="none" stroke="#161513" stroke-width="1.5" stroke-linecap="round" />
    <!-- Small horizontal bar next to monogram -->
    <line x1="193" y1="580" x2="198" y2="580" stroke="#161513" stroke-width="1.5" stroke-linecap="round" />

    <!-- Subtle vintage ink flecks (simulating a stone lithograph print) -->
    <circle cx="482" cy="118" r="1" fill="#161513" opacity="0.7" />
    <circle cx="215" cy="465" r="0.8" fill="#161513" opacity="0.5" />
    <circle cx="648" cy="322" r="1.2" fill="#161513" opacity="0.6" />
  </g>
</svg>